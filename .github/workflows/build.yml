              /** Pasang rel di blok yang dibidik, lalu langsung pasang TNT Minecart di atasnya. */
              public static void tntCart(MinecraftClient mc) {
                  ClientPlayerEntity p = mc.player;
                  if (p == null || mc.interactionManager == null || mc.world == null) return;

                  BlockHitResult hit = aimed(mc);
                  if (hit == null) {
                      p.sendMessage(Text.literal("Arahkan ke blok atau rel"), true);
                      return;
