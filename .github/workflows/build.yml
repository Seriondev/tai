          package com.example.clientutils;

          import net.minecraft.client.gui.DrawContext;

          public class Ui {
              public static final int BG = 0xF0141420;
              public static final int BORDER = 0xFF30304A;
              public static final int PILL = 0xFFE0505E;
              public static final int ON_BG = 0xFF2A4A35;
              public static final int ON_BD = 0xFF4CAF50;
              public static final int OFF_BG = 0xFF4A2A32;
              public static final int OFF_BD = 0xFFB04858;
              public static final int[] PALETTE = {
                      0xFFFFFF, 0xFF5555, 0xFFAA00, 0xFFFF55, 0x55FF55, 0x00AAAA,
                      0x55FFFF, 0x5555FF, 0xAA00AA, 0xFF55FF, 0xAAAAAA, 0x000000
              };

              public static void border(DrawContext c, int x, int y, int w, int h, int col) {
                  c.fill(x, y, x + w, y + 1, col);
                  c.fill(x, y + h - 1, x + w, y + h, col);
                  c.fill(x, y, x + 1, y + h, col);
                  c.fill(x + w - 1, y, x + w, y + h, col);
              }

              public static void box(DrawContext c, int x, int y, int w, int h, int bg, int bd) {
                  c.fill(x, y, x + w, y + h, bg);
                  border(c, x, y, w, h, bd);
              }

              public static String hex(int rgb) {
                  return String.format("#%06X", rgb & 0xFFFFFF);
              }

              public static Integer parseHex(String s) {
                  try {
                      s = s.trim();
                      if (s.startsWith("#")) s = s.substring(1);
                      if (s.length() != 6) return null;
                      return Integer.parseInt(s, 16);
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
