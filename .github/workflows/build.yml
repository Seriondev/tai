          cat > src/main/java/com/example/clientutils/BaseScreen.java <<'EOF'
          package com.example.clientutils;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.function.Consumer;
          import java.util.function.IntConsumer;
          import java.util.function.IntSupplier;
          import java.util.function.Supplier;

          public abstract class BaseScreen extends Screen {
              protected final Screen parent;
              protected final String header;
              protected int px, py, pw, ph;
              protected final List<Object[]> labels = new ArrayList<>();
              protected final List<int[]> swatches = new ArrayList<>();

              protected BaseScreen(Screen parent, String header) {
                  super(Text.literal(header));
                  this.parent = parent;
                  this.header = header;
              }

              protected abstract void build();

              protected int pillX() {
                  return px + 10;
              }

              @Override
              protected void init() {
                  pw = Math.min(this.width - 16, 360);
                  ph = Math.min(this.height - 16, 230);
                  px = (this.width - pw) / 2;
                  py = (this.height - ph) / 2;
                  labels.clear();
                  swatches.clear();
                  if (parent != null) {
                      addDrawableChild(ButtonWidget.builder(Text.empty(), b -> this.client.setScreen(parent))
                              .dimensions(pillX(), py + 8, 130, 20).build());
                  }
                  build();
              }

              protected void label(String s, int x, int y) {
                  labels.add(new Object[]{s, x, y});
              }

              protected void toggle(int y, String name, Supplier<Boolean> get, Consumer<Boolean> set) {
                  addDrawableChild(ButtonWidget.builder(onOff(name, get.get()), btn -> {
                      set.accept(!get.get());
                      Config.save();
                      btn.setMessage(onOff(name, get.get()));
                  }).dimensions(px + 14, y, 230, 20).build());
              }

              protected static Text onOff(String name, boolean on) {
                  return Text.literal(name + ": ")
                          .append(Text.literal(on ? "ON" : "OFF").formatted(on ? Formatting.GREEN : Formatting.RED));
              }

              /** Baris pilih warna: label, kolom hex, dan palet warna. Tinggi baris = 30. */
              protected void colorRow(int y, String name, IntSupplier get, IntConsumer set) {
                  int x = px + 14;
                  label(name, x, y);
                  TextFieldWidget f = new TextFieldWidget(this.textRenderer, x, y + 11, 56, 16, Text.literal(name));
                  f.setMaxLength(7);
                  f.setText(Ui.hex(get.getAsInt()));
                  f.setChangedListener(s -> {
                      Integer v = Ui.parseHex(s);
                      if (v != null) set.accept(v);
                  });
                  addDrawableChild(f);

                  int sx = x + 64;
                  for (int i = 0; i < Ui.PALETTE.length; i++) {
                      final int c = Ui.PALETTE[i];
                      int bx = sx + i * 15;
                      addDrawableChild(ButtonWidget.builder(Text.empty(), b -> {
                          set.accept(c);
                          f.setText(Ui.hex(c));
                      }).dimensions(bx, y + 12, 13, 13).build());
                      swatches.add(new int[]{bx, y + 12, 13, c});
                  }
              }

              @Override
              public void renderBackground(DrawContext c, int mx, int my, float d) {
                  super.renderBackground(c, mx, my, d);
                  Ui.box(c, px, py, pw, ph, Ui.BG, Ui.BORDER);
              }

              @Override
              public void render(DrawContext c, int mx, int my, float d) {
                  super.render(c, mx, my, d);

                  c.fill(pillX(), py + 8, pillX() + 130, py + 28, Ui.PILL);
                  String t = parent != null ? "< " + header : header;
                  c.drawCenteredTextWithShadow(this.textRenderer, Text.literal(t), pillX() + 65, py + 14, 0xFFFFFFFF);

                  for (Object[] l : labels) {
                      c.drawTextWithShadow(this.textRenderer, Text.literal((String) l[0]),
                              (Integer) l[1], (Integer) l[2], 0xFFFFFFFF);
                  }
                  for (int[] s : swatches) {
                      c.fill(s[0], s[1], s[0] + s[2], s[1] + s[2], 0xFF000000 | s[3]);
                      Ui.border(c, s[0] - 1, s[1] - 1, s[2] + 2, s[2] + 2, 0xFF888888);
                  }
              }
          }
