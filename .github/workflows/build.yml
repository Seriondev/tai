                  }

                  BlockPos target = hit.getBlockPos();
                  BlockState bs = mc.world.getBlockState(target);
                  BlockPos base;
                  int prev = inv.getSelectedSlot();

                  if (bs.isOf(Blocks.OBSIDIAN) || bs.isOf(Blocks.BEDROCK)) {
