              /** Pasang Respawn Anchor di blok yang dibidik, lalu isi dengan Glowstone. */
              public static void anchorGlow(MinecraftClient mc) {
                  ClientPlayerEntity p = mc.player;
                  if (p == null || mc.interactionManager == null || mc.world == null) return;

                  BlockHitResult hit = aimed(mc);
                  if (hit == null) {
                      p.sendMessage(Text.literal("Arahkan ke sebuah blok"), true);
                      return;
                  }
                  PlayerInventory inv = p.getInventory();
                  int anchor = hot(inv, Items.RESPAWN_ANCHOR);
                  int glow = hot(inv, Items.GLOWSTONE);
                  if (glow < 0) {
