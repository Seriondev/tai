                  PlayerInventory inv = p.getInventory();
                  int rail = -1, cart = -1;
                  for (int i = 0; i < 9; i++) {
                      ItemStack s = inv.getStack(i);
                      if (rail < 0 && isRailItem(s)) rail = i;
                      if (cart < 0 && s.isOf(Items.TNT_MINECART)) cart = i;
                  }
                  if (cart < 0) {
                      p.sendMessage(Text.literal("TNT Minecart tidak ada di hotbar"), true);
                      return;
                  }

                  BlockPos target = hit.getBlockPos();
                  boolean targetIsRail = mc.world.getBlockState(target).isIn(BlockTags.RAILS);
                  BlockPos railPos;
                  int prev = inv.getSelectedSlot();

                  if (targetIsRail) {
                      railPos = target;
                  } else {
                      if (rail < 0) {
                          p.sendMessage(Text.literal("Rel tidak ada di hotbar"), true);
                          return;
                      }
                      railPos = target.offset(hit.getSide());
                      inv.setSelectedSlot(rail);
                      mc.interactionManager.interactBlock(p, Hand.MAIN_HAND, hit);
                  }

                  inv.setSelectedSlot(cart);
                  BlockHitResult cartHit = new BlockHitResult(Vec3d.ofCenter(railPos), Direction.UP, railPos, false);
                  mc.interactionManager.interactBlock(p, Hand.MAIN_HAND, cartHit);
                  p.swingHand(Hand.MAIN_HAND);
                  inv.setSelectedSlot(prev);
              }

              /** Pasang obsidian di blok yang dibidik, lalu End Crystal di atasnya. */
