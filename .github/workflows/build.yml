name: Build ClientUtils v4 (Fabric 1.21.11)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Resolve Fabric versions and write project files
        run: |
          set -e
          MC=1.21.11
          YARN=$(curl -s https://meta.fabricmc.net/v2/versions/yarn/$MC | jq -r '.[0].version')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable==true)][0].version')
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+$MC</version>" | sed 's/<[^>]*>//g' | tail -1)
          echo "MC=$MC YARN=$YARN LOADER=$LOADER API=$API"
          if [ -z "$YARN" ] || [ -z "$LOADER" ] || [ -z "$API" ]; then echo "Gagal mengambil versi Fabric"; exit 1; fi

          mkdir -p mod && cd mod
          mkdir -p src/main/java/com/example/clientutils/mixin
          mkdir -p src/main/resources/assets/clientutils/lang

          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=$MC
          yarn_mappings=$YARN
          loader_version=$LOADER
          fabric_version=$API
          mod_version=4.0.0
          maven_group=com.example
          archives_base_name=clientutils
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'clientutils'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = 'UTF-8'
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "clientutils",
            "version": "${version}",
            "name": "Client Utils",
            "description": "Client mod: mod menu UI, waypoints, swappers, zoom, freecam, freelook, view model, crosshair, keystrokes and more.",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.example.clientutils.ClientUtilsMod"]
            },
            "mixins": ["clientutils.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/resources/clientutils.mixins.json <<'EOF'
          {
            "required": false,
            "minVersion": "0.8",
            "package": "com.example.clientutils.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "EntityMixin",
              "CameraMixin",
              "GameRendererMixin",
              "HeldItemRendererMixin"
            ],
            "injectors": {
              "defaultRequire": 0
            }
          }
          EOF

          cat > src/main/resources/assets/clientutils/lang/en_us.json <<'EOF'
          {
            "key.category.clientutils.main": "Client Utils",
            "key.clientutils.open": "Open Mod Menu",
            "key.clientutils.elytra": "Elytra Swapper",
            "key.clientutils.spear": "Spear Lunge Swapper",
            "key.clientutils.tnt": "Rail + TNT Cart",
            "key.clientutils.freelook": "Freelook (hold)",
            "key.clientutils.zoom": "Zoom (hold)",
            "key.clientutils.obscrystal": "Obsidian + Crystal",
            "key.clientutils.anchor": "Anchor + Glowstone",
            "key.clientutils.freecam": "Freecam (toggle)"
          }
          EOF

          cat > src/main/java/com/example/clientutils/mixin/EntityMixin.java <<'EOF'
          package com.example.clientutils.mixin;

          import com.example.clientutils.Freecam;
          import com.example.clientutils.Freelook;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.entity.Entity;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(Entity.class)
          public abstract class EntityMixin {
              @Inject(method = "changeLookDirection", at = @At("HEAD"), cancellable = true, require = 0)
              private void clientutils$turn(double dx, double dy, CallbackInfo ci) {
                  if ((Freecam.active || Freelook.active) && (Object) this instanceof ClientPlayerEntity) {
                      if (Freecam.active) Freecam.turn(dx, dy);
                      else Freelook.turn(dx, dy);
                      ci.cancel();
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/mixin/CameraMixin.java <<'EOF'
          package com.example.clientutils.mixin;

          import com.example.clientutils.Freecam;
          import com.example.clientutils.Freelook;
          import net.minecraft.client.render.Camera;
          import net.minecraft.util.math.Vec3d;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.ModifyVariable;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(Camera.class)
          public abstract class CameraMixin {
              @Inject(method = "update", at = @At("HEAD"), require = 0)
              private void clientutils$frame(CallbackInfo ci) {
                  Freecam.frame();
              }

              @ModifyVariable(method = "setRotation", at = @At("HEAD"), argsOnly = true, ordinal = 0, require = 0)
              private float clientutils$yaw(float yaw) {
                  if (Freecam.active) return Freecam.yaw;
                  return Freelook.active ? Freelook.yaw : yaw;
              }

              @ModifyVariable(method = "setRotation", at = @At("HEAD"), argsOnly = true, ordinal = 1, require = 0)
              private float clientutils$pitch(float pitch) {
                  if (Freecam.active) return Freecam.pitch;
                  return Freelook.active ? Freelook.pitch : pitch;
              }

              @ModifyVariable(method = "setPos(DDD)V", at = @At("HEAD"), argsOnly = true, ordinal = 0, require = 0)
              private double clientutils$x(double x) {
                  return Freecam.active ? Freecam.x : x;
              }

              @ModifyVariable(method = "setPos(DDD)V", at = @At("HEAD"), argsOnly = true, ordinal = 1, require = 0)
              private double clientutils$y(double y) {
                  return Freecam.active ? Freecam.y : y;
              }

              @ModifyVariable(method = "setPos(DDD)V", at = @At("HEAD"), argsOnly = true, ordinal = 2, require = 0)
              private double clientutils$z(double z) {
                  return Freecam.active ? Freecam.z : z;
              }

              @ModifyVariable(method = "setPos(Lnet/minecraft/util/math/Vec3d;)V", at = @At("HEAD"), argsOnly = true, require = 0)
              private Vec3d clientutils$vec(Vec3d v) {
                  return Freecam.active ? new Vec3d(Freecam.x, Freecam.y, Freecam.z) : v;
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/mixin/GameRendererMixin.java <<'EOF'
          package com.example.clientutils.mixin;

          import com.example.clientutils.Zoom;
          import net.minecraft.client.render.GameRenderer;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(GameRenderer.class)
          public abstract class GameRendererMixin {
              // Tipe return (float/double) dipertahankan lewat pengecekan runtime
              @Inject(method = "getFov", at = @At("RETURN"), cancellable = true, require = 0)
              private void clientutils$zoom(CallbackInfoReturnable<Object> cir) {
                  float z = Zoom.factor();
                  if (z <= 1.001f) return;
                  Object r = cir.getReturnValue();
                  if (r instanceof Float f) cir.setReturnValue(f / z);
                  else if (r instanceof Double d) cir.setReturnValue(d / z);
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/mixin/HeldItemRendererMixin.java <<'EOF'
          package com.example.clientutils.mixin;

          import com.example.clientutils.Config;
          import net.minecraft.client.util.math.MatrixStack;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.ModifyVariable;

          @Mixin(targets = "net.minecraft.client.render.item.HeldItemRenderer")
          public abstract class HeldItemRendererMixin {
              // Mengubah posisi dan ukuran item/tangan di first person (View Model)
              @ModifyVariable(method = "renderFirstPersonItem", at = @At("HEAD"), argsOnly = true, require = 0)
              private MatrixStack clientutils$viewModel(MatrixStack m) {
                  Config c = Config.get();
                  if (c.viewModel) {
                      m.translate(c.vmX, c.vmY, c.vmZ);
                      m.scale(c.vmScale, c.vmScale, c.vmScale);
                  }
                  return m;
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/Config.java <<'EOF'
          package com.example.clientutils;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;

          public class Config {
              public static class Waypoint {
                  public String name = "Waypoint";
                  /** Kategori = dimensi: minecraft:overworld, minecraft:the_nether, minecraft:the_end */
                  public String dim = "minecraft:overworld";
                  public int x, y, z;
                  public int color = 0x55FF55;
              }

              public boolean healthIndicator = true;
              public boolean waypoints = true;
              public boolean waypointArrow = false;
              public boolean waypointList = true;
              public boolean waypointDistance = true;
              public boolean coordinates = false;

              public boolean elytraSwapper = true;
              public boolean spearSwapper = true;

              public boolean crosshair = true;
              public int crosshairStyle = 3;
              public int crosshairSize = 1;
              public int crosshairColor = 0xFFFFFF;
              public int crosshairTargetColor = 0xFF0000;

              public boolean keystrokes = true;
              public boolean keystrokesMouse = true;
              public boolean keystrokesSpace = true;
              public boolean fps = true;
              public boolean cps = true;

              public boolean freelook = true;
              public boolean fullbright = false;
              public boolean tntCart = true;
              public boolean autoTotem = false;

              // fitur baru
              public boolean zoom = true;
              public float zoomFactor = 4f;
              public boolean zoomSmooth = true;
              public boolean obsCrystal = true;
              public boolean anchorGlow = true;
              public boolean freecam = true;
              public float freecamSpeed = 12f;
              public boolean viewModel = false;
              public float vmX = 0f, vmY = 0f, vmZ = 0f, vmScale = 1f;

              public List<Waypoint> list = new ArrayList<>();

              private static Config INSTANCE = new Config();
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              private static Path path() {
                  return FabricLoader.getInstance().getConfigDir().resolve("clientutils.json");
              }

              public static Config get() {
                  return INSTANCE;
              }

              public static void load() {
                  try {
                      Path p = path();
                      if (Files.exists(p)) {
                          Config c = GSON.fromJson(Files.readString(p), Config.class);
                          if (c != null) {
                              if (c.list == null) c.list = new ArrayList<>();
                              INSTANCE = c;
                          }
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public static void save() {
                  try {
                      Files.writeString(path(), GSON.toJson(INSTANCE));
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public static void resetFeatures() {
                  Config n = new Config();
                  n.list = INSTANCE.list;
                  INSTANCE = n;
                  save();
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/ClientUtilsMod.java <<'EOF'
          package com.example.clientutils;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.VanillaHudElements;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class ClientUtilsMod implements ClientModInitializer {
              public static KeyBinding openKey, elytraKey, spearKey, tntKey, freelookKey,
                      zoomKey, obsKey, anchorKey, freecamKey;

              private static KeyBinding reg(String id, int key, KeyBinding.Category cat) {
                  return KeyBindingHelper.registerKeyBinding(
                          new KeyBinding("key.clientutils." + id, InputUtil.Type.KEYSYM, key, cat));
              }

              @Override
              public void onInitializeClient() {
                  Config.load();

                  KeyBinding.Category cat = KeyBinding.Category.create(Identifier.of("clientutils", "main"));
                  openKey = reg("open", GLFW.GLFW_KEY_U, cat);
                  elytraKey = reg("elytra", GLFW.GLFW_KEY_R, cat);
                  spearKey = reg("spear", GLFW.GLFW_KEY_F, cat);
                  tntKey = reg("tnt", GLFW.GLFW_KEY_K, cat);
                  freelookKey = reg("freelook", GLFW.GLFW_KEY_LEFT_ALT, cat);
                  zoomKey = reg("zoom", GLFW.GLFW_KEY_Z, cat);
                  obsKey = reg("obscrystal", GLFW.GLFW_KEY_F10, cat);
                  anchorKey = reg("anchor", GLFW.GLFW_KEY_F9, cat);
                  freecamKey = reg("freecam", GLFW.GLFW_KEY_J, cat);

                  ClientTickEvents.START_CLIENT_TICK.register(Freecam::tickStart);

                  ClientTickEvents.END_CLIENT_TICK.register(mc -> {
                      Swappers.tick(mc);
                      Freelook.tick(mc);
                      Extras.tick(mc);
                      Freecam.tickEnd(mc);
                      if (mc.player == null || mc.world == null) return;

                      Config cfg = Config.get();
                      while (openKey.wasPressed()) {
                          if (mc.currentScreen == null) mc.setScreen(new ModMenuScreen(0));
                      }
                      while (elytraKey.wasPressed()) {
                          if (mc.currentScreen == null && cfg.elytraSwapper) Swappers.elytra(mc);
                      }
                      while (spearKey.wasPressed()) {
                          if (mc.currentScreen == null && cfg.spearSwapper) Swappers.spear(mc);
                      }
                      while (tntKey.wasPressed()) {
                          if (mc.currentScreen == null && cfg.tntCart) Swappers.tntCart(mc);
                      }
                      while (obsKey.wasPressed()) {
                          if (mc.currentScreen == null && cfg.obsCrystal) Swappers.obsidianCrystal(mc);
                      }
                      while (anchorKey.wasPressed()) {
                          if (mc.currentScreen == null && cfg.anchorGlow) Swappers.anchorGlow(mc);
                      }
                      while (freecamKey.wasPressed()) {
                          if (mc.currentScreen == null && cfg.freecam) Freecam.toggle(mc);
                      }
                  });

                  HudElementRegistry.addLast(Identifier.of("clientutils", "hud"), Hud::render);

                  HudElementRegistry.replaceElement(VanillaHudElements.CROSSHAIR, original -> (ctx, tick) -> {
                      MinecraftClient mc = MinecraftClient.getInstance();
                      if (Config.get().crosshair && mc.options.getPerspective().isFirstPerson()) {
                          Crosshair.renderHud(ctx, mc);
                      } else {
                          original.render(ctx, tick);
                      }
                  });
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/Zoom.java <<'EOF'
          package com.example.clientutils;

          import net.minecraft.client.MinecraftClient;

          public class Zoom {
              private static float cur = 1f;
              private static long last = 0;

              /** Pengali zoom saat ini (1 = tidak zoom). Dipanggil dari mixin FOV setiap frame. */
              public static float factor() {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  Config c = Config.get();
                  long now = System.nanoTime();
                  double dt = last == 0 ? 0.016 : Math.min(0.1, (now - last) / 1e9);
                  last = now;

                  boolean on = c.zoom && mc.currentScreen == null
                          && ClientUtilsMod.zoomKey != null && ClientUtilsMod.zoomKey.isPressed();
                  float target = on ? Math.max(1f, c.zoomFactor) : 1f;
                  if (c.zoomSmooth) cur += (target - cur) * (float) Math.min(1.0, dt * 12.0);
                  else cur = target;
                  if (Math.abs(cur - target) < 0.005f) cur = target;
                  return cur;
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/Freelook.java <<'EOF'
          package com.example.clientutils;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.Perspective;

          public class Freelook {
              public static boolean active;
              public static float yaw, pitch;
              private static Perspective prev;

              public static void tick(MinecraftClient mc) {
                  boolean want = Config.get().freelook
                          && !Freecam.active
                          && mc.player != null
                          && mc.currentScreen == null
                          && ClientUtilsMod.freelookKey != null
                          && ClientUtilsMod.freelookKey.isPressed();

                  if (want && !active) {
                      active = true;
                      yaw = mc.player.getYaw();
                      pitch = mc.player.getPitch();
                      prev = mc.options.getPerspective();
                      mc.options.setPerspective(Perspective.THIRD_PERSON_BACK);
                  } else if (!want && active) {
                      active = false;
                      if (prev != null) mc.options.setPerspective(prev);
                      prev = null;
                  }
              }

              public static void turn(double dx, double dy) {
                  yaw += (float) dx * 0.15f;
                  pitch += (float) dy * 0.15f;
                  if (pitch > 90f) pitch = 90f;
                  if (pitch < -90f) pitch = -90f;
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/Freecam.java <<'EOF'
          package com.example.clientutils;

          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.option.Perspective;
          import net.minecraft.text.Text;
          import net.minecraft.util.Hand;
          import net.minecraft.util.hit.BlockHitResult;
          import net.minecraft.util.hit.HitResult;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.RaycastContext;
          import org.lwjgl.glfw.GLFW;

          /**
           * Freecam: kamera lepas dari pemain, bebas menembus blok. Pemain tetap diam di tempatnya.
           * Klik kanan memasang blok dari arah bidik kamera (selama dalam jangkauan pemain).
           */
          public class Freecam {
              public static boolean active;
              public static double x, y, z;
              public static float yaw, pitch;

              private static long last;
              private static Perspective prev;
              private static boolean rcDown;
              private static int cooldown;

              public static void toggle(MinecraftClient mc) {
                  if (active) stop(mc);
                  else start(mc);
              }

              private static void start(MinecraftClient mc) {
                  if (mc.player == null) return;
                  Vec3d e = mc.player.getEyePos();
                  x = e.x;
                  y = e.y;
                  z = e.z;
                  yaw = mc.player.getYaw();
                  pitch = mc.player.getPitch();
                  prev = mc.options.getPerspective();
                  mc.options.setPerspective(Perspective.FIRST_PERSON);
                  last = 0;
                  rcDown = false;
                  active = true;
                  mc.player.sendMessage(Text.literal("Freecam ON"), true);
              }

              public static void stop(MinecraftClient mc) {
                  if (!active) return;
                  active = false;
                  if (prev != null) mc.options.setPerspective(prev);
                  prev = null;
                  if (mc.player != null) mc.player.sendMessage(Text.literal("Freecam OFF"), true);
              }

              public static void turn(double dx, double dy) {
                  yaw += (float) dx * 0.15f;
                  pitch += (float) dy * 0.15f;
                  if (pitch > 90f) pitch = 90f;
                  if (pitch < -90f) pitch = -90f;
              }

              private static boolean down(MinecraftClient mc, KeyBinding kb) {
                  try {
                      int code = KeyBindingHelper.getBoundKeyOf(kb).getCode();
                      return code > 0 && GLFW.glfwGetKey(mc.getWindow().getHandle(), code) == GLFW.GLFW_PRESS;
                  } catch (Throwable t) {
                      return kb.isPressed();
                  }
              }

              /** Dipanggil setiap frame dari mixin Camera.update. */
              public static void frame() {
                  if (!active) {
                      last = 0;
                      return;
                  }
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (mc.player == null) {
                      active = false;
                      return;
                  }
                  long now = System.nanoTime();
                  double dt = last == 0 ? 0.016 : Math.min(0.1, (now - last) / 1e9);
                  last = now;
                  if (mc.currentScreen != null) return;

                  double yr = Math.toRadians(yaw), pr = Math.toRadians(pitch);
                  double fx = -Math.sin(yr) * Math.cos(pr), fy = -Math.sin(pr), fz = Math.cos(yr) * Math.cos(pr);
                  double rx = -Math.cos(yr), rz = -Math.sin(yr);

                  var o = mc.options;
                  double mx = 0, my = 0, mz = 0;
                  if (down(mc, o.forwardKey)) {
                      mx += fx;
                      my += fy;
                      mz += fz;
                  }
                  if (down(mc, o.backKey)) {
                      mx -= fx;
                      my -= fy;
                      mz -= fz;
                  }
                  if (down(mc, o.rightKey)) {
                      mx += rx;
                      mz += rz;
                  }
                  if (down(mc, o.leftKey)) {
                      mx -= rx;
                      mz -= rz;
                  }
                  if (down(mc, o.jumpKey)) my += 1;
                  if (down(mc, o.sneakKey)) my -= 1;

                  double len = Math.sqrt(mx * mx + my * my + mz * mz);
                  if (len > 0) {
                      mx /= len;
                      my /= len;
                      mz /= len;
                  }
                  double sp = Config.get().freecamSpeed * (down(mc, o.sprintKey) ? 2.0 : 1.0) * dt;
                  x += mx * sp;
                  y += my * sp;
                  z += mz * sp;
              }

              /** Awal tick: cegah pemain bergerak/menyerang/memakai item selagi freecam aktif. */
              public static void tickStart(MinecraftClient mc) {
                  if (!active || mc.player == null) return;
                  var o = mc.options;
                  o.forwardKey.setPressed(false);
                  o.backKey.setPressed(false);
                  o.leftKey.setPressed(false);
                  o.rightKey.setPressed(false);
                  o.jumpKey.setPressed(false);
                  o.sneakKey.setPressed(false);
                  o.sprintKey.setPressed(false);
                  o.useKey.setPressed(false);
                  o.attackKey.setPressed(false);
                  while (o.useKey.wasPressed()) {
                  }
                  while (o.attackKey.wasPressed()) {
                  }
              }

              public static void tickEnd(MinecraftClient mc) {
                  if (!active) return;
                  if (mc.player == null || mc.world == null) {
                      active = false;
                      return;
                  }
                  if (!Config.get().freecam) {
                      stop(mc);
                      return;
                  }
                  if (mc.currentScreen != null) return;

                  boolean rc = GLFW.glfwGetMouseButton(mc.getWindow().getHandle(),
                          GLFW.GLFW_MOUSE_BUTTON_RIGHT) == GLFW.GLFW_PRESS;
                  if (cooldown > 0) cooldown--;
                  if (rc && (!rcDown || cooldown == 0)) {
                      place(mc);
                      cooldown = 5;
                  }
                  rcDown = rc;
              }

              private static void place(MinecraftClient mc) {
                  if (mc.interactionManager == null) return;
                  double yr = Math.toRadians(yaw), pr = Math.toRadians(pitch);
                  Vec3d start = new Vec3d(x, y, z);
                  Vec3d dir = new Vec3d(-Math.sin(yr) * Math.cos(pr), -Math.sin(pr), Math.cos(yr) * Math.cos(pr));
                  Vec3d end = start.add(dir.multiply(32.0));

                  BlockHitResult hit = mc.world.raycast(new RaycastContext(start, end,
                          RaycastContext.ShapeType.OUTLINE, RaycastContext.FluidHandling.NONE, mc.player));
                  if (hit.getType() != HitResult.Type.BLOCK) return;

                  if (mc.player.getEyePos().distanceTo(hit.getPos()) > 5.0) {
                      mc.player.sendMessage(Text.literal("Terlalu jauh dari pemain (maks ~5 blok)"), true);
                      return;
                  }
                  mc.interactionManager.interactBlock(mc.player, Hand.MAIN_HAND, hit);
                  mc.player.swingHand(Hand.MAIN_HAND);
              }
          }
