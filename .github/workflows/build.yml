          import java.util.function.Consumer;
          import java.util.function.Supplier;

          public class SettingsScreen extends BaseScreen {
              private final String id;
              private final String name;

              public SettingsScreen(Screen parent, String id, String name) {
                  super(parent, name);
                  this.id = id;
                  this.name = name;
              }

              private static String fmt(float v) {
                  return String.format("%.2f", v);
              }

              /** Baris pengatur nilai: [-] nama: nilai [+] */
              private void stepper(int y, String label, Supplier<Float> get, Consumer<Float> set,
                                   float step, float min, float max) {
                  ButtonWidget mid = ButtonWidget.builder(Text.literal(label + ": " + fmt(get.get())), b -> {
                  }).dimensions(px + 44, y, 170, 20).build();
                  ButtonWidget minus = ButtonWidget.builder(Text.literal("-"), b -> {
                      float v = Math.max(min, Math.round((get.get() - step) * 100f) / 100f);
                      set.accept(v);
                      Config.save();
                      mid.setMessage(Text.literal(label + ": " + fmt(v)));
                  }).dimensions(px + 14, y, 26, 20).build();
                  ButtonWidget plus = ButtonWidget.builder(Text.literal("+"), b -> {
                      float v = Math.min(max, Math.round((get.get() + step) * 100f) / 100f);
                      set.accept(v);
                      Config.save();
                      mid.setMessage(Text.literal(label + ": " + fmt(v)));
                  }).dimensions(px + 218, y, 26, 20).build();
                  addDrawableChild(minus);
                  addDrawableChild(mid);
                  addDrawableChild(plus);
              }

              @Override
              protected void build() {
                  Config c = Config.get();
                  int y = py + 38;
                  switch (id) {
                      case "crosshair" -> {
                          addDrawableChild(ButtonWidget.builder(styleText(), b -> {
                              c.crosshairStyle = (c.crosshairStyle + 1) % Crosshair.STYLES.length;
                              Config.save();
                              b.setMessage(styleText());
                          }).dimensions(px + 14, y, 140, 20).build());
                          addDrawableChild(ButtonWidget.builder(sizeText(), b -> {
                              c.crosshairSize = c.crosshairSize % 4 + 1;
                              Config.save();
                              b.setMessage(sizeText());
                          }).dimensions(px + 160, y, 90, 20).build());
                          colorRow(y + 28, "Color", () -> c.crosshairColor, v -> {
                              c.crosshairColor = v;
                              Config.save();
                          });
                          colorRow(y + 60, "Target Color", () -> c.crosshairTargetColor, v -> {
                              c.crosshairTargetColor = v;
                              Config.save();
                          });
                          label("Preview", px + 14, y + 96);
                      }
                      case "waypoints" -> {
                          toggle(y, "Tampilkan jarak (saat dibidik)", () -> c.waypointDistance, v -> c.waypointDistance = v);
                          toggle(y + 24, "Panah waypoint terdekat", () -> c.waypointArrow, v -> c.waypointArrow = v);
                          addDrawableChild(ButtonWidget.builder(Text.literal("Kelola Waypoint..."),
                                  b -> this.client.setScreen(new WaypointListScreen(this, 0)))
                                  .dimensions(px + 14, y + 52, 230, 20).build());
                          label("Nama dan koordinat muncul saat bidikan", px + 14, y + 80);
                          label("tepat di penanda waypoint.", px + 14, y + 92);
                      }
                      case "keystrokes" -> {
                          toggle(y, "Tampilkan mouse (LMB/RMB)", () -> c.keystrokesMouse, v -> c.keystrokesMouse = v);
                          toggle(y + 24, "Tampilkan Spasi", () -> c.keystrokesSpace, v -> c.keystrokesSpace = v);
                      }
                      case "freelook" -> {
                          label("Tahan Left Alt: kamera bebas (third person),", px + 14, y);
                          label("arah badan dan tembakan tidak berubah.", px + 14, y + 12);
                          label("Lepas tombol: kamera kembali normal.", px + 14, y + 24);
                          label("Ganti tombol di Options > Controls.", px + 14, y + 40);
                      }
                      case "tnt" -> {
                          label("Tekan K: arahkan ke blok, rel dipasang lalu", px + 14, y);
                          label("TNT Minecart langsung dipasang di atasnya.", px + 14, y + 12);
                          label("Kalau yang dibidik sudah rel, hanya cart.", px + 14, y + 24);
                          label("Rel dan TNT Minecart harus ada di hotbar.", px + 14, y + 36);
                      }
                      case "zoom" -> {
                          stepper(y, "Zoom", () -> c.zoomFactor, v -> c.zoomFactor = v, 0.5f, 1.5f, 10f);
                          toggle(y + 26, "Animasi halus", () -> c.zoomSmooth, v -> c.zoomSmooth = v);
                          label("Tahan Z untuk zoom (ganti di Controls).", px + 14, y + 58);
                      }
                      case "obs" -> {
                          label("Tekan F10: arahkan ke blok. Obsidian dipasang", px + 14, y);
                          label("di sisi yang dibidik, lalu End Crystal di atasnya.", px + 14, y + 12);
                          label("Kalau yang dibidik sudah obsidian/bedrock,", px + 14, y + 24);
                          label("hanya crystal yang dipasang.", px + 14, y + 36);
                          label("Obsidian dan End Crystal harus ada di hotbar.", px + 14, y + 52);
                      }
                      case "anchor" -> {
                          label("Tekan F9: arahkan ke blok. Respawn Anchor dipasang", px + 14, y);
                          label("di sisi yang dibidik, lalu diisi Glowstone.", px + 14, y + 12);
                          label("Kalau yang dibidik sudah anchor, hanya isi glowstone.", px + 14, y + 24);
                          label("Anchor dan Glowstone harus ada di hotbar.", px + 14, y + 40);
                      }
                      case "freecam" -> {
                          stepper(y, "Kecepatan", () -> c.freecamSpeed, v -> c.freecamSpeed = v, 2f, 2f, 60f);
                          label("Tekan J untuk masuk/keluar. WASD, Spasi (naik),", px + 14, y + 30);
                          label("Shift (turun), Ctrl (2x cepat). Badanmu tetap diam.", px + 14, y + 42);
                          label("Klik kanan memasang blok dari bidikan kamera,", px + 14, y + 54);
                          label("selama dalam jangkauan pemain (maks ~5 blok).", px + 14, y + 66);
                      }
                      case "viewmodel" -> {
                          stepper(y, "X (kiri/kanan)", () -> c.vmX, v -> c.vmX = v, 0.05f, -2f, 2f);
                          stepper(y + 24, "Y (atas/bawah)", () -> c.vmY, v -> c.vmY = v, 0.05f, -2f, 2f);
                          stepper(y + 48, "Z (depan/belakang)", () -> c.vmZ, v -> c.vmZ = v, 0.05f, -2f, 2f);
                          stepper(y + 72, "Ukuran", () -> c.vmScale, v -> c.vmScale = v, 0.05f, 0.2f, 2.5f);
                          addDrawableChild(ButtonWidget.builder(Text.literal("Reset posisi & ukuran"), b -> {
                              c.vmX = 0f;
                              c.vmY = 0f;
                              c.vmZ = 0f;
                              c.vmScale = 1f;
                              Config.save();
                              this.client.setScreen(new SettingsScreen(parent, id, name));
                          }).dimensions(px + 14, y + 100, 230, 20).build());
                          label("Aktifkan fitur View Model di menu agar berlaku.", px + 14, y + 126);
                      }
                      default -> label("Tidak ada pengaturan.", px + 14, y);
                  }
              }

              private Text styleText() {
                  Config c = Config.get();
                  return Text.literal("Style: " + Crosshair.STYLES[c.crosshairStyle % Crosshair.STYLES.length]);
              }

              private Text sizeText() {
                  return Text.literal("Size: " + Config.get().crosshairSize);
              }

              @Override
              public void render(DrawContext c, int mx, int my, float d) {
                  super.render(c, mx, my, d);
                  if (id.equals("crosshair")) {
                      Config cfg = Config.get();
                      int bx = px + 14, by = py + 148, bw = 110, bh = 60;
                      Ui.box(c, bx, by, bw, bh, 0xFF22222F, Ui.BORDER);
                      Crosshair.draw(c, bx + 30, by + bh / 2, cfg.crosshairStyle, cfg.crosshairSize, cfg.crosshairColor);
                      Crosshair.draw(c, bx + 80, by + bh / 2, cfg.crosshairStyle, cfg.crosshairSize, cfg.crosshairTargetColor);
                  }
              }
          }
